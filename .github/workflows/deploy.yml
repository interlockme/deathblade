name: Deploy Deathblade Guides

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes used to race two `gh-deploy --force` runs against the same
# gh-pages branch, and whichever finished last won regardless of which was
# newer. Queue them instead. Not cancel-in-progress: a half-finished deploy
# cancelled mid-push would leave gh-pages in a torn state.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---- Gates: pure-stdlib scripts, no extra installs ----

      - name: Check id references resolve
        run: python3 scripts/check_ids.py

      - name: Check content (dates, id/class pairing, name drift)
        run: python3 scripts/check_content.py

      # Parses every source JS file before the build. minify_assets.py --verify
      # below only checks the already-minified copies, so a syntax error would
      # otherwise surface late and point at the stripped file, not your edit.
      # node is preinstalled on ubuntu-latest. This catches syntax errors only,
      # not typo'd variable names.
      - name: Syntax-check JS
        run: |
          set -e
          for f in docs/javascripts/*.js; do
            node --check "$f" || { echo "::error file=$f::JS syntax error"; exit 1; }
          done

      # ---- Build ----

      # Strict makes the validation: block in mkdocs.yml (broken links/anchors,
      # omitted files) fail the build, so a broken link blocks the deploy.
      # Confirmed passing on a GitHub runner.
      - name: Build site
        run: mkdocs build --strict --site-dir site

      # Strips comments from this site's own css/js in the BUILT output only.
      # docs/ is untouched, so local `mkdocs serve` still shows every comment.
      # --verify runs `node --check` on each stripped file (node is preinstalled
      # on ubuntu-latest) and aborts rather than shipping anything that stopped
      # parsing.
      - name: Minify built assets
        run: python3 scripts/minify_assets.py site --verify

      # Cache-busts every own css/js URL with a hash of its final bytes, so a
      # changed file can never be served stale to a returning visitor and there
      # is no ?v= to bump by hand. Must run AFTER minify_assets.py (it hashes
      # what actually ships) and after the build.
      - name: Hash asset URLs
        run: python3 scripts/hash_assets.py site

      # Self-test for the step above (stdlib only, runs in a second).
      - name: Test asset hashing
        run: python3 scripts/test_hash_assets.py

      # ---- Deploy ----
      # This is exactly what `mkdocs gh-deploy --force --no-history` does
      # internally (see mkdocs/commands/gh_deploy.py), just split apart so the
      # minify step above can run between building and publishing.
      #   -n no-jekyll   -p push   -f force   -o no-history
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import -n -p -f -o -m "Deployed ${GITHUB_SHA::8} with mkdocs" site
