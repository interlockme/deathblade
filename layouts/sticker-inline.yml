definitions:

  - &background_color >-
    {%- if layout.background_color -%}
      {{ layout.background_color }}
    {%- else -%}
      #161718
    {%- endif -%}

  - &color >-
    {%- if layout.color -%}
      {{ layout.color }}
    {%- else -%}
      #f4e9fb
    {%- endif -%}

  - &font_family >-
    {%- if layout.font_family -%}
      {{ layout.font_family }}
    {%- elif config.theme.font is mapping -%}
      {{ config.theme.font.get("text", "Roboto") }}
    {%- else -%}
      Roboto
    {%- endif -%}

  - &site_name >-
    {{ config.site_name }}

  - &page_title >-
    {%- if layout.title -%}
      {{ layout.title }}
    {%- else -%}
      {{ page.meta.get("title", page.title) | replace("★", "") | trim }}
    {%- endif -%}

  - &page_title_with_site_name >-
    {%- if not page.is_homepage -%}
      {{ page.meta.get("title", page.title) | replace("★", "") | trim }} - {{ config.site_name }}
    {%- else -%}
      {{ config.site_name }}
    {%- endif -%}

  - &page_description >-
    {%- if layout.description -%}
      {{ layout.description }}
    {%- else -%}
      {{ page.meta.get("description", config.site_description) | x }}
    {%- endif -%}

  - &logo_icon >-
    {%- if config.theme.icon -%}
      {{ config.theme.icon.logo | x }}
    {%- endif -%}

  - &sticker_image >-
    {{ layout.sticker_image | x }}

tags:
  og:type: website
  og:title: *page_title_with_site_name
  og:description: *page_description
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:url: "{{ page.canonical_url }}"

  twitter:card: summary_large_image
  twitter:title: *page_title_with_site_name
  twitter:description: *page_description
  twitter:image: "{{ image.url }}"

size: { width: 1200, height: 630 }
layers:

  - background:
      color: *background_color

  # Logo icon, top-right (unchanged from your current card)
  - size: { width: 144, height: 144 }
    offset: { x: 992, y: 64 }
    icon:
      value: *logo_icon
      color: *color

  # Site name, top-left
  - size: { width: 832, height: 42 }
    offset: { x: 64, y: 64 }
    typography:
      content: *site_name
      color: *color
      font:
        family: *font_family
        style: Bold

  # Page title - allows up to 2 lines so long titles (e.g. "Additional Resources")
  # shrink and wrap instead of overflowing or glitching
  - size: { width: 832, height: 150 }
    offset: { x: 62, y: 140 }
    typography:
      content: *page_title
      align: start
      color: *color
      line:
        amount: 2
        height: 1.25
      font:
        family: *font_family
        style: Bold

  # Small sticker, sitting between title and description
  - size: { width: 240, height: 240 }
    offset: { x: 64, y: 245 }
    background:
      image: *sticker_image

  # Page description
  - size: { width: 832, height: 64 }
    offset: { x: 64, y: 512 }
    typography:
      content: *page_description
      align: start
      color: *color
      line:
        amount: 2
        height: 1.5
      font:
        family: *font_family
        style: Regular
