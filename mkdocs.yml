site_name: Deathblade
site_url: https://interlockme.github.io/deathblade/
site_description: Remaining Energy & Surge Deathblade guides
theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: pink
  font:
    text: Poppins
    code: Roboto Mono
  icon:
    logo: material/sword-cross
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.footer
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.integrate
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css?v=17

# Load order matters: several widgets read a shared data file
# (build-data.js/skill-data.js/skill-names.js/ap-node-names.js) or the
# shared site-utils.js helpers, which must already exist on window
# before they run. Each widget's own file-top comment says what it
# needs loaded first if you're moving things around; rough shape below:
#   1. site-utils.js first - shared DOM helpers every widget below uses
#   2. extra.js, cpm-calculator.js, bid-calculator.js,
#      ark-passive-calculator.js - standalone, no cross-file deps
#   3. data files: build-data.js, skill-data.js, skill-names.js,
#      ap-node-names.js
#   4. renderer widgets that read those data files: build-stats-badge.js,
#      skill-setup.js, essentials-table.js, ark-core-badge.js,
#      ark-passive-tree.js, gem-priority.js, pentagon-badge.js,
#      rotation-line.js, dps-chart.js, build-compare.js, last-updated.js,
#      image-lightbox.js
#   5. widgets that read the DOM step 4 just built: rotation-practice.js
#      (after rotation-line.js), gem-dps-tooltip.js (after gem-priority.js
#      AND dps-chart.js)
#
# Forking for another class? Every file above has its own "FORK GUIDE:"
# comment at the very top - DATA (rewrite the whole file), ENGINE/INFRA
# (reusable as-is), or DEATHBLADE-SPECIFIC (delete or rewrite from
# scratch). See README.md's "Forking this for your own spin" section
# for the full breakdown.
extra_javascript:
  - javascripts/site-utils.js?v=6
  - javascripts/extra.js?v=2
  - javascripts/cpm-calculator.js?v=6
  - javascripts/bid-calculator.js?v=4
  - javascripts/ark-passive-calculator.js?v=5
  - javascripts/build-data.js?v=4
  - javascripts/build-stats-badge.js?v=1
  - javascripts/skill-data.js?v=3
  - javascripts/skill-names.js?v=2
  - javascripts/skill-setup.js?v=7
  - javascripts/essentials-table.js?v=3
  - javascripts/ark-core-badge.js?v=3
  - javascripts/ap-node-names.js?v=1
  - javascripts/ark-passive-tree.js?v=4
  - javascripts/gem-priority.js?v=4
  - javascripts/pentagon-badge.js?v=4
  - javascripts/rotation-line.js?v=3
  - javascripts/rotation-practice.js?v=3
  - javascripts/dps-chart.js?v=4
  - javascripts/gem-dps-tooltip.js?v=5
  - javascripts/build-compare.js?v=4
  - javascripts/last-updated.js?v=3
  - javascripts/image-lightbox.js?v=1

extra:
  generator: false

plugins:
  - search
  - privacy:
      # Material's bundled JS always contains a reference to Mermaid's CDN
      # url (it's how Material lazy-loads Mermaid when a diagram is found
      # on a page), and the privacy plugin eagerly self-hosts every
      # external asset it finds referenced in the build, including that
      # one - even though this site has zero Mermaid diagrams anywhere in
      # docs/. Without this exclusion, every deploy downloads and bundles
      # an unused copy of Mermaid.js for nothing.
      assets_exclude:
        - "*mermaid*"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Remaining Energy:
      - Essentials: remaining-energy/essentials.md
      - Pre-Ark Grid: remaining-energy/pre-ark-grid.md
      - Standard: remaining-energy/standard.md
      - 111 Head Hunt: remaining-energy/111-head-hunt.md
      - 313 High Floor: remaining-energy/313-high-floor.md
      - 333 Ceiling ★: remaining-energy/333-ceiling.md
  - Surge:
      - Essentials: surge/essentials.md
      - Pre-Ark Grid: surge/pre-ark-grid.md
      - 111 Classic: surge/111-classic.md
      - 222 Speedy: surge/222-speedy.md
      - 333 Blitz: surge/333-blitz.md
  - Additional Resources: resources.md